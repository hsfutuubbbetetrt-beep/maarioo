<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Over</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#12060a; --sangue:#c4122f; --brasa:#ff5a36; --osso:#f2e6d8; --sombra:#3a0b14;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 40%,var(--sombra),var(--fundo) 70%);
  color:var(--osso); font-family:'VT323',monospace; font-size:1.5rem;
  display:grid; place-items:center; overflow:hidden;
}
body::after{ /* linhas de CRT */
  content:""; position:fixed; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);
}
.tela{text-align:center;padding:2rem;animation:cair 1.2s cubic-bezier(.2,.9,.2,1) both}
.sub{opacity:.7;letter-spacing:.1em;margin-bottom:1.5rem}
.titulo{
  position:relative; font-family:'Press Start 2P',monospace;
  font-size:clamp(2rem,9vw,5.5rem); line-height:1.15; color:var(--sangue);
  text-shadow:0 0 18px rgba(196,18,47,.7),4px 4px 0 #000;
  animation:tremer 4s infinite;
}
.titulo::before,.titulo::after{
  content:attr(data-text); position:absolute; inset:0; overflow:hidden;
}
.titulo::before{color:var(--brasa);transform:translate(-3px,0);clip-path:inset(0 0 60% 0);mix-blend-mode:screen;opacity:.6}
.titulo::after{color:#2de2e6;transform:translate(3px,0);clip-path:inset(55% 0 0 0);mix-blend-mode:screen;opacity:.4}
.placar{display:flex;justify-content:center;gap:2.5rem;margin:2.5rem 0;flex-wrap:wrap}
.placar dt{opacity:.6}
.placar dd{font-size:2.2rem;color:var(--brasa)}
.acoes{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{
  font:inherit;font-family:'Press Start 2P',monospace;font-size:.8rem;
  padding:1rem 1.6rem;color:var(--osso);background:transparent;
  border:3px solid var(--osso);cursor:pointer;transition:transform .12s,background .12s;
}
.btn:hover{background:var(--osso);color:var(--fundo)}
.btn:active{transform:translateY(3px)}
.btn:focus-visible{outline:3px solid var(--brasa);outline-offset:4px}
.btn.principal{background:var(--sangue);border-color:var(--sangue)}
.btn.principal:hover{background:var(--brasa);border-color:var(--brasa);color:#000}
.dica{margin-top:1.5rem;opacity:.5;font-size:1.2rem}
@keyframes cair{from{opacity:0;transform:translateY(-40px) scale(1.15)}to{opacity:1;transform:none}}
@keyframes tremer{0%,92%,100%{transform:none}94%{transform:translate(-4px,2px)}96%{transform:translate(4px,-2px)}98%{transform:translate(-2px,0)}}
@media (prefers-reduced-motion:reduce){.tela,.titulo{animation:none}}
</style>
</head>
<body>
<main class="tela">
  <p class="sub">Você caiu na fase 7</p>
  <h1 class="titulo" data-text="GAME OVER">GAME OVER</h1>
  <dl class="placar">
    <div><dt>Pontos</dt><dd id="pontos">0</dd></div>
    <div><dt>Recorde</dt><dd id="recorde">0</dd></div>
    <div><dt>Tempo</dt><dd id="tempo">00:00</dd></div>
  </dl>
  <div class="acoes">
    <button id="renascer" class="btn principal">Renascer</button>
  </div>
  <p class="dica">Pressione Enter para renascer</p>
</main>
<script>
// Dados fictícios da partida (troque pelos do seu jogo)
const pontos = 12850;
const segundos = 187;

let recorde = pontos;
try { recorde = Math.max(pontos, Number(localStorage.getItem('recorde')) || 0); localStorage.setItem('recorde', recorde); } catch (e) {}

document.getElementById('pontos').textContent = pontos.toLocaleString('pt-BR');
document.getElementById('recorde').textContent = recorde.toLocaleString('pt-BR');
document.getElementById('tempo').textContent =
  String(Math.floor(segundos / 60)).padStart(2, '0') + ':' + String(segundos % 60).padStart(2, '0');

// Renascer: recarrega a página
const renascer = () => location.reload();
document.getElementById('renascer').addEventListener('click', renascer);
document.addEventListener('keydown', e => { if (e.key === 'Enter') renascer(); });
</script>
</body>
</html>
